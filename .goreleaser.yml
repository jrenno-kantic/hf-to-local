version: 2

project_name: hf-to-local

before:
  hooks:
    - go mod tidy

builds:
  - id: hf-to-local
    main: ./cmd/hf-to-local
    binary: hf-to-local
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

# One SBOM per archive, so consumers can see exactly what shipped.
sboms:
  - id: archives
    artifacts: archive

# Sign the checksum file rather than each archive: checksums.txt already covers
# every artifact, so one signature verifies the whole release. Keyless signing
# uses the workflow's OIDC identity, which is why release.yml needs id-token.
#
# --use-signing-config=false is required from cosign v3 on. v3 flipped that flag
# to default true, which makes cosign fetch a TUF signing config and take a
# branch that writes a Sigstore bundle to --bundle and returns before it ever
# honors --output-signature. With no --bundle set that is an empty path, and
# signing dies with "create bundle file: open : no such file or directory".
# Opting out keeps the .sig/.pem pair the README's verify-blob recipe expects.
#
# The flags below are deprecated in favor of bundles, so a future cosign will
# drop them. Migrating means emitting ${artifact}.bundle and rewriting the
# "Verifying a download" section of README.md to match.
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--use-signing-config=false"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# Publishes Casks/hf-to-local.rb to github.com/jrenno-kantic/homebrew-tap on
# each tagged release, so `brew install jrenno-kantic/tap/hf-to-local` works.
#
# This is a Cask, not a Formula: GoReleaser deprecated `brews` in v2.16 because
# formulas that drop in a pre-built binary were always a workaround. The
# generated cask carries Linux URLs too, but Homebrew only supports casks on
# macOS, so Linux users should install from the release archive.
#
# Pushing to another repository needs a PAT with `contents: write` on the tap,
# exported as the HOMEBREW_TAP_GITHUB_TOKEN secret; the default GITHUB_TOKEN is
# scoped to this repository only. skip_upload degrades gracefully when that
# secret is absent: the cask is still generated and the rest of the release
# succeeds rather than failing on an auth error. With the token present it falls
# back to "auto", which skips prereleases and snapshots.
homebrew_casks:
  - name: hf-to-local
    binaries:
      - hf-to-local
    repository:
      owner: jrenno-kantic
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    skip_upload: '{{ if .Env.HOMEBREW_TAP_GITHUB_TOKEN }}auto{{ else }}true{{ end }}'
    commit_author:
      name: goreleaser[bot]
      email: 1207947+goreleaser[bot]@users.noreply.github.com
    commit_msg_template: "hf-to-local {{ .Version }}"
    homepage: "https://github.com/jrenno-kantic/hf_to_local"
    description: "Create local model folders that link into the Hugging Face Hub cache"
    license: "MIT"
    # Lets `brew audit` accept a homepage that differs from the download domain.
    url:
      verified: github.com/jrenno-kantic/hf_to_local
    # The binary is unsigned, so Gatekeeper would quarantine it on first run.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/hf-to-local"]
          end

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
