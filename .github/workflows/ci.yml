name: CI

on:
  push:
  pull_request:

jobs:
  go:
    # This tool's core job is creating symlinks, hardlinks and copies, and it
    # has platform-specific handling for Windows symlink privileges and for
    # cross-filesystem hardlinks. Those paths only get exercised if CI runs
    # somewhere other than Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      # The race detector needs a C toolchain; skip it on Windows and keep the
      # plain run there so the platform is still covered.
      - run: go test -race ./...
        if: matrix.os != 'windows-latest'
      - run: go test ./...
        if: matrix.os == 'windows-latest'
      - run: go vet ./...
      - run: go build -trimpath -ldflags="-s -w" -o bin/hf-to-local ./cmd/hf-to-local

  minimum-go:
    # The OS matrix runs on the current toolchain, so without this the floor
    # declared in go.mod would never actually be exercised and would silently
    # drift upwards.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

  release-config:
    # Validates .goreleaser.yml on every push, so a broken release config is
    # caught here rather than at tag time when it would abort a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: latest
          args: check
