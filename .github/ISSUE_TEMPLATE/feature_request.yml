name: Feature request
description: Suggest a capability or a change to existing behavior
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is awkward or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: >
        What should happen instead. If it means a new flag, suggest the name and
        what its default would be.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: >
        This tool reads the Hugging Face cache and creates links elsewhere. It
        does not download models and never writes to the cache.
      options:
        - label: This request keeps the tool within that scope
          required: true
